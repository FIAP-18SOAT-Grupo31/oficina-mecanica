spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/oficina_mecanica}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:admin}

spring.flyway.locations=classpath:db/migration,classpath:db/seed/dev
spring.jpa.show-sql=false

app.seguranca.jwt.segredo=${JWT_SECRET:dev-segredo-local-com-pelo-menos-32-bytes}
app.seguranca.usuarios-demo.senha=${DEMO_PASSWORD:dev123}

springdoc.swagger-ui.try-it-out-enabled=true
