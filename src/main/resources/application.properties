spring.application.name=oficina-mecanica
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

app.seguranca.jwt.segredo=${JWT_SECRET:}
app.seguranca.jwt.validade=1h
app.seguranca.usuarios-demo.senha=${DEMO_PASSWORD:}
app.seguranca.limite-requisicoes.por-minuto=${LIMITE_REQUISICOES_POR_MINUTO:30}

app.notificacao.url-base=${APP_URL_BASE:http://localhost:8080}
app.email.remetente=${EMAIL_REMETENTE:oficina@oficina-mecanica.local}
app.email.smtp.habilitado=${EMAIL_SMTP_HABILITADO:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

management.endpoints.web.exposure.include=${ACTUATOR_EXPOSICAO:health,info,metrics}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html

server.error.include-stacktrace=never
server.error.include-message=never
