spring.application.name=oficina-mecanica
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

app.seguranca.jwt.segredo=${JWT_SECRET:}
app.seguranca.jwt.validade=1h
app.seguranca.usuarios-demo.senha=${DEMO_PASSWORD:}
app.seguranca.limite-requisicoes.por-minuto=${LIMITE_REQUISICOES_POR_MINUTO:30}

management.endpoints.web.exposure.include=${ACTUATOR_EXPOSICAO:health,info,metrics}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html

server.error.include-stacktrace=never
server.error.include-message=never
